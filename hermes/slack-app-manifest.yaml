# Hermes/Hermy Slack app manifest — Socket Mode.
# Create at https://api.slack.com/apps → Create New App → From a manifest.
# This sets every bot scope + event subscription + enables Socket Mode in one
# paste. Scopes/events are taken verbatim from the Hermes Slack docs.
# Still manual afterward (a manifest can't mint tokens): generate the
# app-level token, install to the workspace, grab your member ID.
display_information:
  name: Hermy
  description: Hermes agent
features:
  bot_user:
    display_name: Hermy
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - users:read
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.mpim
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
